name: Deploy React/Vite na Locaweb

on:
  push:
    branches:
      - "migracao-locaweb"
  workflow_dispatch:

permissions:
  contents: read

# Não cancela um deploy em andamento quando um novo commit chega.
# Os novos deploys ficam em fila e são executados em ordem.
concurrency:
  group: locaweb-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar variáveis do Supabase
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          test -n "$VITE_SUPABASE_PROJECT_ID" || { echo "Secret VITE_SUPABASE_PROJECT_ID não configurado"; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Secret VITE_SUPABASE_PUBLISHABLE_KEY não configurado"; exit 1; }
          test -n "$VITE_SUPABASE_URL" || { echo "Secret VITE_SUPABASE_URL não configurado"; exit 1; }

      - name: Gerar ambiente de produção
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          printf 'VITE_SUPABASE_PROJECT_ID=%s\n' "$VITE_SUPABASE_PROJECT_ID" > .env.production
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env.production
          printf 'VITE_SUPABASE_URL=%s\n' "$VITE_SUPABASE_URL" >> .env.production

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

      - name: Preparar arquivos da hospedagem
        run: |
          test -f dist/index.html
          cp .htaccess dist/.htaccess

      - name: Validar credenciais FTP
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" || { echo "Secret HOST não configurado"; exit 1; }
          test -n "$USER" || { echo "Secret USER não configurado"; exit 1; }
          test -n "$PASS" || { echo "Secret PASS não configurado"; exit 1; }

      - name: Publicar na Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist"
          remoteDir: "public_html"
