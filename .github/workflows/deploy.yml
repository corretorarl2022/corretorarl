name: Deploy React/Vite na Locaweb

on:
  push:
    branches:
      - "migracao-locaweb"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: locaweb-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Validar chave do Supabase
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo "Secret VITE_SUPABASE_PUBLISHABLE_KEY não configurado"; exit 1; }

      - name: Gerar ambiente de produção
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          printf '%s\n' 'VITE_SUPABASE_PROJECT_ID=eliymkgbzgjhzepicmrx' > .env.production
          printf 'VITE_SUPABASE_PUBLISHABLE_KEY=%s\n' "$VITE_SUPABASE_PUBLISHABLE_KEY" >> .env.production
          printf '%s\n' 'VITE_SUPABASE_URL=https://eliymkgbzgjhzepicmrx.supabase.co' >> .env.production

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm run test

      - name: Build de produção
        run: npm run build

      - name: Diagnosticar URL Supabase incorporada no build
        run: |
          echo "=== Diagnóstico Supabase no dist ==="
          if grep -R -F "tbfyfluyllekqcdpztxq" dist >/dev/null 2>&1; then
            echo "ERRO: projeto incorreto tbfyfluyllekqcdpztxq encontrado no dist"
            exit 1
          fi
          if grep -R -F "eliymkgbzgjhzepicmrx.supabase.co" dist >/dev/null 2>&1; then
            echo "OK: projeto correto eliymkgbzgjhzepicmrx encontrado no dist"
          else
            echo "ERRO: projeto correto não encontrado no dist"
            exit 1
          fi

      - name: Preparar arquivos da hospedagem
        run: |
          test -f dist/index.html
          cp .htaccess dist/.htaccess

      - name: Validar credenciais FTP
        env:
          HOST: ${{ secrets.HOST }}
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
        run: |
          test -n "$HOST" || { echo "Secret HOST não configurado"; exit 1; }
          test -n "$USER" || { echo "Secret USER não configurado"; exit 1; }
          test -n "$PASS" || { echo "Secret PASS não configurado"; exit 1; }

      - name: Publicar na Locaweb
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "dist"
          remoteDir: "public_html"
